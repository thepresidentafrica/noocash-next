name: TPA Workflows

on:
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v3
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/pnpm.lock') }}
      - name: setup pnpm
        uses: pnpm/action-setup@v2.2.4
        with:
          version: 8
      - name: pnpm install
        run: pnpm install --no-frozen-lockfile
      - name: pnpm build all 
        run: pnpm build -r
